<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Abstract drug-gene knowledge graph">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1e33"/>
      <stop offset="0.55" stop-color="#122f4a"/>
      <stop offset="1" stop-color="#0f4d55"/>
    </linearGradient>
    <radialGradient id="g2t" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6fd8d2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#6fd8d2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2g" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="0.5" stop-color="#ffd98a"/>
      <stop offset="0.5" stop-color="#e8f6f5"/>
      <stop offset="1" stop-color="#e8f6f5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg2)"/>

  <!-- faint hex lattice -->
  <g stroke="#ffffff" stroke-opacity="0.045" fill="none">
    <path d="M60 60 l30 -18 l30 18 v36 l-30 18 l-30 -18 z"/>
    <path d="M660 320 l30 -18 l30 18 v36 l-30 18 l-30 -18 z"/>
    <path d="M120 300 l30 -18 l30 18 v36 l-30 18 l-30 -18 z"/>
  </g>

  <!-- knowledge graph edges -->
  <g stroke="#4aa8a2" stroke-opacity="0.65" stroke-width="1.6">
    <path d="M400 210 L280 130 M400 210 L520 120 M400 210 L300 300 M400 210 L540 300 M280 130 L520 120 M280 130 L170 200 M520 120 L640 190 M300 300 L170 200 M540 300 L640 190 M300 300 L540 300"/>
    <path d="M170 200 L90 130 M640 190 L710 120 M540 300 L620 370 M280 130 L240 50 M520 120 L560 40" stroke-opacity="0.35"/>
  </g>

  <!-- predicted (dashed gold) links -->
  <g stroke="#ffd98a" stroke-width="2" stroke-dasharray="2 9" stroke-linecap="round" stroke-opacity="0.85">
    <path d="M400 210 L710 120"/>
    <path d="M170 200 L300 300"/>
  </g>

  <!-- hub node -->
  <circle cx="400" cy="210" r="52" fill="url(#g2g)"/>
  <circle cx="400" cy="210" r="15" fill="#ffd98a"/>
  <circle cx="400" cy="210" r="24" fill="none" stroke="#ffd98a" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- satellite nodes -->
  <g>
    <circle cx="280" cy="130" r="30" fill="url(#g2t)"/><circle cx="280" cy="130" r="9" fill="#6fd8d2"/>
    <circle cx="520" cy="120" r="30" fill="url(#g2t)"/><circle cx="520" cy="120" r="9" fill="#6fd8d2"/>
    <circle cx="300" cy="300" r="30" fill="url(#g2t)"/><circle cx="300" cy="300" r="9" fill="#6fd8d2"/>
    <circle cx="540" cy="300" r="30" fill="url(#g2t)"/><circle cx="540" cy="300" r="9" fill="#6fd8d2"/>
    <circle cx="170" cy="200" r="24" fill="url(#g2t)"/><circle cx="170" cy="200" r="7" fill="#9fd6d3"/>
    <circle cx="640" cy="190" r="24" fill="url(#g2t)"/><circle cx="640" cy="190" r="7" fill="#9fd6d3"/>
  </g>
  <g fill="#8fb8c9">
    <circle cx="90" cy="130" r="4.5"/><circle cx="710" cy="120" r="4.5"/><circle cx="620" cy="370" r="4.5"/>
    <circle cx="240" cy="50" r="4"/><circle cx="560" cy="40" r="4"/>
  </g>

  <!-- capsule (drug) -->
  <g transform="translate(120,330) rotate(-28)">
    <rect x="-38" y="-15" width="76" height="30" rx="15" fill="url(#cap)"/>
    <line x1="0" y1="-15" x2="0" y2="15" stroke="#0f2a43" stroke-opacity="0.25" stroke-width="1.5"/>
  </g>

  <!-- DNA helix -->
  <g transform="translate(688,268)" stroke-linecap="round" fill="none">
    <path d="M0 0 C 22 12, 22 36, 0 48 C -22 60, -22 84, 0 96" stroke="#6fd8d2" stroke-width="3"/>
    <path d="M0 0 C -22 12, -22 36, 0 48 C 22 60, 22 84, 0 96" stroke="#ffd98a" stroke-width="3"/>
    <g stroke="#cfe6ec" stroke-width="2" stroke-opacity="0.8">
      <line x1="-12" y1="12" x2="12" y2="12"/><line x1="-14" y1="24" x2="14" y2="24"/>
      <line x1="-12" y1="36" x2="12" y2="36"/><line x1="-12" y1="60" x2="12" y2="60"/>
      <line x1="-14" y1="72" x2="14" y2="72"/><line x1="-12" y1="84" x2="12" y2="84"/>
    </g>
  </g>
</svg>
