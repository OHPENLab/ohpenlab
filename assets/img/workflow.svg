<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-label="Lab workflow: multimodal health data flows into AI models and agents, producing better care and safer therapeutics">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1e33"/>
      <stop offset="0.6" stop-color="#0f2a43"/>
      <stop offset="1" stop-color="#11455c"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="wg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffd98a"/>
    </marker>
  </defs>
  <rect width="1200" height="380" fill="url(#wbg)"/>

  <!-- connecting arrows -->
  <g stroke="#ffd98a" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M392 190 H 448" marker-end="url(#arrow)"/>
    <path d="M792 190 H 848" marker-end="url(#arrow)"/>
  </g>

  <!-- Panel 1: data -->
  <g>
    <rect x="40" y="52" width="350" height="276" rx="18" fill="url(#panel)" stroke="#6fd8d2" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="215" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#ffffff">Multimodal Health Data</text>
    <!-- EHR document -->
    <g transform="translate(95,130)">
      <rect x="0" y="0" width="62" height="78" rx="8" fill="#eaf2f7"/>
      <rect x="10" y="12" width="42" height="6" rx="3" fill="#0e8f8a"/>
      <rect x="10" y="26" width="42" height="5" rx="2.5" fill="#8fb8c9"/>
      <rect x="10" y="38" width="30" height="5" rx="2.5" fill="#8fb8c9"/>
      <path d="M10 60 h8 l5 -12 l7 22 l6 -16 l4 6 h12" fill="none" stroke="#d9645a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="126" y="238" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#c6d8e4">EHRs &amp; notes</text>
    <!-- audit log clicks -->
    <g transform="translate(200,132)">
      <rect x="0" y="0" width="62" height="74" rx="8" fill="#0e3247" stroke="#6fd8d2" stroke-opacity="0.6"/>
      <g fill="#6fd8d2"><rect x="9" y="10" width="26" height="5" rx="2.5"/><rect x="9" y="22" width="40" height="5" rx="2.5"/><rect x="9" y="34" width="33" height="5" rx="2.5"/><rect x="9" y="46" width="44" height="5" rx="2.5"/><rect x="9" y="58" width="22" height="5" rx="2.5"/></g>
      <path d="M46 50 l14 16 l-6 1 l4 9 l-5 2 l-4 -9 l-5 4 z" fill="#ffd98a" stroke="#0a1e33" stroke-width="1"/>
    </g>
    <text x="231" y="238" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#c6d8e4">Audit logs</text>
    <!-- DNA -->
    <g transform="translate(320,134)" fill="none" stroke-linecap="round">
      <path d="M0 0 C 18 10, 18 28, 0 38 C -18 48, -18 66, 0 76" stroke="#6fd8d2" stroke-width="3"/>
      <path d="M0 0 C -18 10, -18 28, 0 38 C 18 48, 18 66, 0 76" stroke="#ffd98a" stroke-width="3"/>
      <g stroke="#cfe6ec" stroke-width="2"><line x1="-10" y1="10" x2="10" y2="10"/><line x1="-11" y1="19" x2="11" y2="19"/><line x1="-10" y1="28" x2="10" y2="28"/><line x1="-10" y1="48" x2="10" y2="48"/><line x1="-11" y1="57" x2="11" y2="57"/><line x1="-10" y1="66" x2="10" y2="66"/></g>
    </g>
    <text x="320" y="238" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#c6d8e4">Genomics</text>
    <text x="215" y="288" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#8fb8c9">+ wearables · literature · FAERS · knowledge bases</text>
  </g>

  <!-- Panel 2: models -->
  <g>
    <rect x="450" y="52" width="340" height="276" rx="18" fill="url(#panel)" stroke="#ffd98a" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="620" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#ffffff">AI Models &amp; Agents</text>
    <!-- graph neural network motif -->
    <g stroke="#4aa8a2" stroke-width="1.6" stroke-opacity="0.8">
      <path d="M620 175 L555 135 M620 175 L685 135 M620 175 L555 225 M620 175 L685 225 M555 135 L685 135 M555 225 L685 225 M555 135 L555 225 M685 135 L685 225"/>
    </g>
    <circle cx="620" cy="175" r="34" fill="url(#wg)"/>
    <circle cx="620" cy="175" r="12" fill="#ffd98a"/>
    <g><circle cx="555" cy="135" r="8" fill="#6fd8d2"/><circle cx="685" cy="135" r="8" fill="#6fd8d2"/><circle cx="555" cy="225" r="8" fill="#6fd8d2"/><circle cx="685" cy="225" r="8" fill="#6fd8d2"/></g>
    <text x="620" y="266" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#c6d8e4">Graph AI · foundation models</text>
    <text x="620" y="290" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#c6d8e4">LLMs · role-specific AI agents</text>
  </g>

  <!-- Panel 3: impact -->
  <g>
    <rect x="850" y="52" width="310" height="276" rx="18" fill="url(#panel)" stroke="#6fd8d2" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="1005" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#ffffff">Impact</text>
    <!-- heart -->
    <g transform="translate(938,150)">
      <path d="M0 14 C -4 2, -24 0, -24 16 C -24 30, -6 40, 0 46 C 6 40, 24 30, 24 16 C 24 0, 4 2, 0 14 Z" fill="#d9645a"/>
      <path d="M-16 22 h9 l4 -9 l6 16 l4 -10 l3 5 h8" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="938" y="238" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#c6d8e4">Better care delivery</text>
    <!-- shield + pill -->
    <g transform="translate(1072,148)">
      <path d="M0 -6 L26 4 V22 C 26 40, 14 50, 0 56 C -14 50, -26 40, -26 22 V4 Z" fill="#0e8f8a"/>
      <g transform="translate(0,24) rotate(-30)">
        <rect x="-16" y="-7" width="16" height="14" rx="7" fill="#ffd98a"/>
        <rect x="0" y="-7" width="16" height="14" rx="7" fill="#eaf2f7"/>
      </g>
    </g>
    <text x="1072" y="238" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#c6d8e4">Safer therapeutics</text>
    <text x="1005" y="288" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#8fb8c9">outcomes · equity · discovery</text>
  </g>
</svg>
